# HTTP server block - handles ACME challenge and redirects to HTTPS
server {
    listen 80;
    server_name statzz.nl www.statzz.nl;

    # Cloudflare-only
    if ($http_cf_connecting_ip = "") { return 403; }
    if ($http_cf_ray = "")           { return 403; }

    # ACME challenge for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server block
server {
    listen 443 ssl;
    server_name statzz.nl www.statzz.nl;

    ssl_certificate /etc/letsencrypt/live/statzz.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/statzz.nl/privkey.pem;

    # Cloudflare-only
    if ($http_cf_connecting_ip = "") { return 403; }
    if ($http_cf_ray = "")           { return 403; }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Proxy API requests
    location /api/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_connect_timeout 20s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy general requests
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_connect_timeout 20s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
